<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>묘연 사주 X MBTI</title>
<meta name="description" content="묘연 사주 X MBTI — 사주, MBTI, 혈액형으로 보는 나의 종합 분석과 궁합. made by yena choi">
<meta name="theme-color" content="#E9DDFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="묘연">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="묘연 사주 X MBTI">
<meta property="og:description" content="오늘, 나에 대해 얼마나 알고 있나요? 사주·MBTI·혈액형 종합 분석과 궁합">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: three views — home (moving), step-by-step input with rabbit guide, analysis result. Brand palette: lavender, baby pink, butter, cream, point purple, text brown. Single pastel look by brand choice. */
:root{
  --cream:#FFF9F1; --lav:#E9DDFB; --pink:#FFDDE8; --butter:#FFF0B8; --purple:#8C72B5; --brown:#493C53;
  --bg:var(--cream); --surface:#ffffff; --line:#eee3f4; --fg:var(--brown); --muted:#76687f; --faint:#a093a8;
  --deep:#6e57a0; --rose:#c95f84; --good:#4c8f7a; --warn:#c8603f;
  --wood:#4c9a7c; --fire:#e0646a; --earth:#d29b2a; --metal:#a99dbb; --water:#4b4f7c; --track:#f3ecf8;
  --display:"Song Myung","Noto Serif KR",serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --hanja:"Noto Serif KR","Song Myung",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
.view{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer;border-radius:14px;padding:12px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600}
button.primary{background:var(--purple);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(140,114,181,.35)}
button.soft{background:var(--lav);border-color:transparent;color:var(--deep)}
button.ghost{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:500;font-size:14px}
button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--purple);outline-offset:2px}
input:disabled{opacity:.45}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--purple)}
.logo{display:flex;align-items:center;gap:8px}
.logo .mk{width:34px;height:34px;border-radius:10px;background-size:cover;flex:none;box-shadow:0 2px 8px rgba(140,114,181,.25)}
.logo b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--brown);letter-spacing:.04em}
.logo i{font-style:normal;font-family:var(--hanja);font-size:12px;color:var(--purple);letter-spacing:.2em}
.by{font-size:12px;color:var(--faint);font-style:italic;letter-spacing:.04em}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* rabbits */
.rab{flex:none;border-radius:50%;background-color:#f7f3f8;background-repeat:no-repeat;background-size:cover;background-position:center;box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--lav)}
.rab.s{width:40px;height:40px}.rab.m{width:60px;height:60px}.rab.l{width:76px;height:76px}
.port{background-color:#f7f3f8;background-size:cover;background-position:50% 6%;background-repeat:no-repeat}

/* ---------- home */
.hero{position:relative;border-radius:28px;overflow:hidden;padding:22px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  background:linear-gradient(160deg,var(--lav) 0%,var(--pink) 58%,var(--butter) 100%)}
.spark{position:absolute;width:10px;height:10px;pointer-events:none;background:radial-gradient(circle,#fff 30%,rgba(255,255,255,0) 70%);border-radius:50%}
.duo{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:10px}
.arch{width:min(36vw,170px);aspect-ratio:3/4;border-radius:999px 999px 22px 22px;box-shadow:0 0 0 5px #fff,0 12px 30px rgba(73,60,83,.18)}
.arch.small{width:min(26vw,120px)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,7.4vw,36px);line-height:1.3;color:var(--brown)}
.hero .lead{color:var(--muted);font-size:14px;max-width:34ch}
.hero .cta{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}
.hero .cta button{width:100%;font-size:17px;padding:15px}
.badge-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.7);color:var(--deep);font-weight:600}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.kick{font-size:12px;color:var(--purple);letter-spacing:.12em;font-weight:700}
.card h2{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.3}
.today{background:var(--butter);border-color:transparent}
.today .row{display:flex;align-items:center;gap:14px}
.today .gz{font-family:var(--hanja);font-weight:700;font-size:34px;line-height:1.1;background:#fff;border-radius:16px;padding:8px 12px;flex:none;text-align:center}
.today .gz small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
.lucky{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lucky div{background:rgba(255,255,255,.7);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--muted);min-width:0}
.lucky b{display:block;font-size:15px;color:var(--brown)}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:480px){.recs{grid-template-columns:1fr}}
.rec{text-align:left;display:flex;flex-direction:column;gap:6px;border:0;border-radius:18px;padding:14px;min-width:0;font-weight:400;white-space:normal}
.rec b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--brown)}
.rec span{font-size:13px;color:var(--muted)}
.rec .ic{font-family:var(--hanja);font-size:22px;color:var(--deep)}
.rec.c1{background:var(--pink)}.rec.c2{background:var(--lav)}.rec.c3{background:var(--butter)}
.mq{overflow:hidden;white-space:nowrap;border-radius:14px;background:var(--lav);padding:10px 0}
.mq-track{display:inline-flex;gap:22px;padding-right:22px;animation:mq 50s linear infinite}
.mq-track span{font-family:var(--hanja);font-size:20px;color:var(--deep)}
.mq-track span small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:4px}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:no-preference){
  .bob{animation:bob 3.2s ease-in-out infinite}.bob.d{animation-delay:-1.6s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
  .spark{animation:tw 2.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
  .fade{animation:fd .45s ease both}@keyframes fd{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){.mq-track{animation:none}}

/* ---------- wizard */
.prog{display:flex;flex-direction:column;gap:6px}
.prog .t{height:10px;border-radius:99px;background:var(--lav);overflow:hidden}
.prog .t i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--rose));border-radius:99px;transition:width .4s ease}
.prog .l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.guide{display:flex;gap:12px;align-items:flex-end}
.bubble{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:15px;min-width:0}
.bubble b{color:var(--deep)}
.wz{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.wz h2{font-family:var(--display);font-weight:400;font-size:22px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:16px;font-weight:600;white-space:normal}
.opt[aria-pressed="true"]{background:var(--lav);border-color:var(--purple);color:var(--deep)}
.opt small{font-weight:400;font-size:12px;color:var(--muted)}
.opt .rab{width:64px;height:64px}
.axis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.axis .opt{flex-direction:row;justify-content:center;gap:8px;padding:10px}
.axis .opt b{font-size:20px;font-family:var(--display);font-weight:400}
.type{font-family:var(--display);font-size:40px;text-align:center;color:var(--deep);letter-spacing:.08em;line-height:1.1}
.blood{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.blood .opt b{font-size:22px;font-family:var(--display);font-weight:400}
.nav{display:flex;gap:10px}
.nav button{flex:1;padding:14px}
.nav button.primary{flex:2}
.err{color:var(--warn);font-size:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--faint)}
.steps span.on{background:var(--purple);color:#fff;border-color:transparent}
.steps span.done{color:var(--deep);border-color:var(--lav);background:var(--lav)}

/* ---------- result */
#shot{display:flex;flex-direction:column;gap:16px;background:var(--bg);padding:14px 12px 18px;margin:0 -12px;border-radius:12px}
.shot-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rhero{border-radius:26px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:linear-gradient(160deg,var(--lav),var(--pink) 60%,var(--butter))}
.rhero .nm{font-family:var(--display);font-size:30px;line-height:1.2}
.rhero .one{font-size:15px;color:var(--brown);max-width:36ch}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px}
.trio div{background:rgba(255,255,255,.75);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.trio small{font-size:11px;color:var(--muted)}
.trio b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2}
.pp{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.pp b{font-family:var(--display);font-weight:400;font-size:20px}
.pp span{font-size:12px;color:var(--muted)}
.heart{font-family:var(--hanja);color:var(--rose);font-size:26px;align-self:center;padding-bottom:40px}
.big{display:flex;flex-direction:column;align-items:center}
.big .n{font-family:var(--display);font-size:60px;line-height:1;font-variant-numeric:tabular-nums;color:var(--deep)}
.big .n small{font-size:17px;color:var(--muted);margin-left:4px;font-family:var(--body)}
.big .lb{font-size:15px;color:var(--rose);font-weight:700}
.subs{width:100%;max-width:340px;display:flex;flex-direction:column;gap:6px}
.sub{display:grid;grid-template-columns:52px 1fr 30px;gap:10px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub .t{height:8px;border-radius:99px;background:rgba(255,255,255,.75);overflow:hidden}
.sub .t i{display:block;height:100%;background:var(--purple);border-radius:99px}
.sub b{color:var(--brown);text-align:right}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h .n{font-family:var(--display);font-size:34px;line-height:1;color:var(--deep);font-variant-numeric:tabular-nums}
.sec-h .n small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:4px}
.card.ca{border-top:5px solid var(--purple)} .card.cb{border-top:5px solid var(--rose)}
.who{display:flex;gap:14px;align-items:center}
.who .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:21px;font-family:var(--display)}
.badge{font-family:var(--body);font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--lav);color:var(--deep)}
.cb .badge{background:var(--pink);color:var(--rose)}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pl{background:var(--cream);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;border:1.5px solid var(--line)}
.pl.day{border-color:var(--purple);background:var(--lav)}
.pl .lb{font-size:12px;color:var(--faint)}
.pl .hz{font-family:var(--hanja);font-size:26px;font-weight:700;line-height:1.15;display:flex;flex-direction:column;align-items:center}
.pl .ko{font-size:13px;color:var(--muted)}
.pl .tg{font-size:11px;color:var(--faint);text-align:center;line-height:1.35}
.pl.none .hz{color:var(--faint);font-size:15px;font-family:var(--body);font-weight:500;padding-block:14px}
.e0{color:var(--wood)}.e1{color:var(--fire)}.e2{color:var(--earth)}.e3{color:var(--metal)}.e4{color:var(--water)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:44px 1fr 18px;gap:10px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .hj{font-family:var(--hanja);margin-left:4px;color:var(--faint)}
.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.bar b{font-weight:600;text-align:right;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--butter);color:var(--brown)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile.t1{background:var(--lav)}.tile.t2{background:var(--pink)}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;font-family:var(--display)}
.tile .s{font-size:12px;color:var(--muted)}
.txt{display:flex;flex-direction:column;gap:10px}
.txt p{max-width:65ch}
.txt strong{font-weight:700;color:var(--deep);margin-right:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--deep);font-weight:700}
.kv dd{margin:0;min-width:0}
.cmp{display:flex;flex-direction:column;gap:8px}
.cmp-row{display:grid;grid-template-columns:52px repeat(3,1fr);gap:6px;align-items:center;font-size:13px}
.cmp-row.h{font-size:12px;color:var(--muted);font-weight:600}
.cmp-row .ax{color:var(--muted);font-weight:600}
.cmp-row span.v{background:var(--cream);border-radius:10px;padding:6px 4px;text-align:center;border:1.5px solid var(--line);min-width:0}
.cmp-row span.v.m{background:var(--lav);border-color:var(--purple);color:var(--deep);font-weight:700}
.cmp-row span.v.x{color:var(--faint)}
.note{border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px}
.note.na{background:var(--lav)} .note.nb{background:var(--pink)}
.note .from{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.note h3{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.35}
.note .care{font-size:14px;padding-top:8px;border-top:1.5px solid rgba(73,60,83,.12)}
.items{display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:6px 1fr;gap:12px}
.item .st{border-radius:3px;background:var(--good)} .item.warn .st{background:var(--warn)} .item.neu .st{background:var(--purple)}
.item strong{font-weight:700}
.gold-badge{align-self:flex-start;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--butter);color:var(--brown);font-weight:700}
.verdict{position:relative}
.verdict .seal{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:8px;background:var(--rose);color:#fff;font-family:var(--hanja);font-weight:700;font-size:15px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(6deg)}
.verdict h2{padding-right:54px}
.sign{font-size:13px;color:var(--faint);text-align:right}
.tips{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.tips{grid-template-columns:1fr 1fr 1fr}}
.tip{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--cream)}
.tip .k{font-size:12px;color:var(--purple);font-weight:700}
.tip b{font-family:var(--display);font-weight:400;font-size:19px}
.tip p{font-size:14px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;white-space:nowrap}
.actions button.primary{flex:1 1 100%}
.foot{font-size:12px;color:var(--faint);text-align:center;max-width:52ch;margin:0 auto}
.toast{font-size:14px;color:var(--good);text-align:center}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(40,30,50,.82);display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px))}
.ov p{color:#fff;font-size:14px;text-align:center}
.ov img{max-width:min(100%,520px);border-radius:10px}
.ov button{min-width:120px}

.hint{font-size:12px;color:var(--faint)}
.skip{width:100%;background:none;border:1.5px dashed var(--purple);color:var(--deep);font-weight:600;padding:13px}
/* 9:16 share card */
.ov .sc-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.ov .btns{display:flex;gap:8px}
.sc{width:360px;height:640px;flex:none;overflow:hidden;position:relative;display:flex;flex-direction:column;gap:12px;padding:22px 20px 18px;color:var(--brown);font-family:var(--body);
  background:linear-gradient(160deg,var(--lav) 0%,var(--pink) 58%,var(--butter) 100%);border-radius:0;word-break:keep-all}
.sc .hd{display:flex;justify-content:space-between;align-items:center}
.sc .hd .logo b{font-size:24px}
.sc .hd small{font-size:11px;color:var(--deep);font-weight:700;letter-spacing:.08em}
.sc .face{width:118px;height:118px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 5px #fff,0 0 0 7px var(--purple)}
.sc .face.sm{width:96px;height:96px}
.sc .ctr{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sc .nm{font-family:var(--display);font-size:28px;line-height:1.2}
.sc .one{font-size:13px;line-height:1.5;max-width:30ch}
.sc .chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sc .chips3 div{background:rgba(255,255,255,.8);border-radius:12px;padding:6px 4px;text-align:center;font-size:10px;color:var(--muted)}
.sc .chips3 b{display:block;font-family:var(--display);font-weight:400;font-size:17px;color:var(--brown);line-height:1.25}
.sc .pz{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sc .pz div{background:rgba(255,255,255,.8);border-radius:10px;padding:4px 0;text-align:center;font-family:var(--hanja);font-weight:700;font-size:18px;line-height:1.2}
.sc .pz div small{display:block;font-family:var(--body);font-weight:400;font-size:10px;color:var(--faint)}
.sc .pz div.d{background:#fff;box-shadow:0 0 0 1.5px var(--purple)}
.sc .tl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sc .tl div{background:#fff;border-radius:14px;padding:8px 10px;display:flex;flex-direction:column}
.sc .tl small{font-size:10px;color:var(--muted);font-weight:700}
.sc .tl b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.15;color:var(--deep)}
.sc .tl span{font-size:10px;color:var(--muted);line-height:1.35}
.sc .box{background:rgba(255,255,255,.88);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:12px;line-height:1.5}
.sc .box b{color:var(--deep)}
.sc .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--deep)}
.sc .ft i{font-style:italic}
.sc .score{font-family:var(--display);font-size:62px;line-height:1;color:var(--deep)}
.sc .score small{font-family:var(--body);font-size:16px;color:var(--muted);margin-left:2px}
.sc .lbl{font-size:14px;color:var(--rose);font-weight:700}
.sc .subs2{display:flex;flex-direction:column;gap:5px}
.sc .subs2 div{display:grid;grid-template-columns:44px 1fr 24px;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.sc .subs2 i{display:block;height:7px;border-radius:9px;background:rgba(255,255,255,.8);overflow:hidden;position:relative}
.sc .subs2 i em{position:absolute;left:0;top:0;bottom:0;background:var(--purple);border-radius:9px}
.sc .subs2 b{text-align:right;color:var(--brown)}
.sc .tagr{display:flex;flex-wrap:wrap;gap:5px}
.sc p{color:var(--brown);margin:0;text-align:left;font-size:inherit}
.sc .one{text-align:center}
.sc .tagr span{background:var(--butter);border-radius:99px;padding:2px 8px;font-size:11px}
</style>
</head>

// ---------- helpers
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hasBatchim(w){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0}
const j=(w,a,b)=>w+(hasBatchim(w)?a:b);
const short=n=>(n.length===3?n.slice(1):n);
function tenGod(d,o){const rel=(STEM_EL[o]-STEM_EL[d]+5)%5,same=(d%2)===(o%2);
  return [['비견','겁재'],['식신','상관'],['편재','정재'],['편관','정관'],['편인','정인']][rel][same?0:1]}
const tgCatEl=(d,el)=>['비겁','식상','재성','관성','인성'][(el-STEM_EL[d]+5)%5];
const tgCat=t=>({'비견':'비겁','겁재':'비겁','식신':'식상','상관':'식상','편재':'재성','정재':'재성','편관':'관성','정관':'관성','편인':'인성','정인':'인성'})[t];
const pairIn=(list,a,b)=>list.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a));

// ---------- astronomy
function sunLon(ms){const jd=ms/864e5+2440587.5,T=(jd-2451545)/36525,r=Math.PI/180;
  const L0=280.46646+36000.76983*T+0.0003032*T*T,M=(357.52911+35999.05029*T-0.0001537*T*T)*r;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const l=L0+C-0.00569-0.00478*Math.sin((125.04-1934.136*T)*r);return((l%360)+360)%360}
function isKDST(y,m,d,h){const v=((y*100+m)*100+d)*100+h;
  return (y===1987&&v>=1987051002&&v<1987101103)||(y===1988&&v>=1988050802&&v<1988100903)}

function core(y,m,d,hh,mi,known){
  const dst=known&&isKDST(y,m,d,hh)?60:0;
  const lon=sunLon(Date.UTC(y,m-1,d,hh,mi)-(540+dst)*6e4);
  let yy=y; if(m<=2&&lon>=270&&lon<315) yy=y-1;
  const yi=((yy-4)%60+60)%60, ys=yi%10, yb=yi%12;
  const k=Math.floor((((lon-315)%360)+360)%360/30);
  const mb=(2+k)%12, ms=((ys%5)*2+2+k)%10;
  let dayNum,hour=null;
  if(known){const loc=Date.UTC(y,m-1,d,hh,mi)-(dst+32)*6e4;const t=new Date(loc);const H=t.getUTCHours(),Mi=t.getUTCMinutes();
    dayNum=Math.floor(loc/864e5)+(H>=23?1:0);
    const hb=Math.floor((H*60+Mi+60)/120)%12; hour={hb,H,Mi};}
  else dayNum=Math.floor(Date.UTC(y,m-1,d)/864e5);
  const di=((dayNum-10957+54)%60+60)%60, ds=di%10, db=di%12;
  const P={year:{s:ys,b:yb},month:{s:ms,b:mb},day:{s:ds,b:db},hour:null};
  if(hour){P.hour={s:((ds%5)*2+hour.hb)%10,b:hour.hb};}
  const list=[P.hour,P.day,P.month,P.year].filter(Boolean);
  const counts=[0,0,0,0,0];list.forEach(p=>{counts[STEM_EL[p.s]]++;counts[BR_EL[p.b]]++});
  const brs=list.map(p=>p.b);
  const gw=brs.filter(b=>GWIIN[ds].includes(b)).length;
  return {P,list,counts,brs,gw,corr:hour};
}

// ---------- Monte Carlo baseline for rarity
let MC=null;
function mcInit(){if(MC)return MC;let a=20041025;const rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const s0=Date.UTC(1960,0,1),s1=Date.UTC(2010,11,31),N=9000;MC={N,k:[],u:[]};
  for(let i=0;i<N;i++){const dt=new Date(s0+Math.floor(rnd()*(s1-s0)));
    const c=core(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate(),dt.getUTCHours(),dt.getUTCMinutes(),true);
    const u=[0,0,0,0,0];[c.P.day,c.P.month,c.P.year].forEach(p=>{u[STEM_EL[p.s]]++;u[BR_EL[p.b]]++});
    MC.k.push({c:c.counts,g:c.gw});MC.u.push({c:u,g:c.brs.slice(1).filter(b=>GWIIN[c.P.day.s].includes(b)).length});}
  return MC}
function freq(known,pred){const m=mcInit(),arr=known?m.k:m.u;let n=0;for(const x of arr)if(pred(x))n++;return n/arr.length*100}

// ---------- per person analysis
function analyze(p){
  const [y,m,d]=p.date.split('-').map(Number);let hh=12,mi=0;const known=!!p.time;
  if(known)[hh,mi]=p.time.split(':').map(Number);
  const c=core(y,m,d,hh,mi,known);const ds=c.P.day.s;
  const ilju=STEMS[ds]+BR[c.P.day.b], iljuKo=STEM_KO[ds]+BR_KO[c.P.day.b];
  // ten gods
  const others=[];
  [['hour',c.P.hour],['day',c.P.day],['month',c.P.month],['year',c.P.year]].forEach(([k,pl])=>{if(!pl)return;
    if(k!=='day')others.push({t:tenGod(ds,pl.s),pos:k,ch:STEMS[pl.s]});
    others.push({t:tenGod(ds,BR_MAIN[pl.b]),pos:k,ch:BR[pl.b]});});
  const cnt=t=>others.filter(o=>o.t===t).length;
  const cat={};others.forEach(o=>{const k=tgCat(o.t);(cat[k]=cat[k]||[]).push(o.ch)});
  const n=x=>(cat[x]||[]).length;
  const missing=c.counts.map((v,i)=>v===0?i:-1).filter(i=>i>=0);
  const season=['겨울','겨울','봄','봄','봄','여름','여름','여름','가을','가을','가을','겨울'][c.P.month.b];
  const gwBr=c.brs.filter(b=>GWIIN[ds].includes(b));
  // 인복 score
  const parts=[];let s=50;
  const add=(v,l)=>{if(v){s+=v;parts.push(`${l} ${v>0?'+':''}${v}`)}};
  add(Math.min(n('인성'),3)*5,`인성 ${n('인성')}개`);
  add(Math.min(gwBr.length,2)*7,`천을귀인 ${gwBr.length}개`);
  add(cnt('정관')*3,`정관 ${cnt('정관')}개`);
  add(cnt('식신')*2,`식신 ${cnt('식신')}개`);
  add(n('비겁')>3?-3:n('비겁'),`비겁 ${n('비겁')}개`);
  add(-4*missing.length,`없는 오행 ${missing.length}개`);
  if(Math.max(...c.counts)>=4)add(-3,'한 오행 쏠림');
  const inbok=Math.max(30,Math.min(95,s));
  // 신살
  const dbg=c.P.day.b, grp=[[8,0,4],[2,6,10],[5,9,1],[11,3,7]].findIndex(g=>g.includes(dbg));
  const DOHWA=[9,3,6,0][grp], YEOKMA=[2,8,11,5][grp], HWAGAE=[4,10,1,7][grp];
  const oth=c.brs.filter((b,i)=>c.list[i]!==c.P.day);
  const sal=[];
  if(gwBr.length)sal.push(`천을귀인 ${gwBr.map(b=>BR[b]).join('·')}`);
  if(GOEGANG.includes(ilju))sal.push('괴강');
  if(BAEKHO.includes(ilju))sal.push('백호');
  if(oth.includes(DOHWA))sal.push('도화');
  if(oth.includes(YEOKMA))sal.push('역마');
  if(oth.includes(HWAGAE))sal.push('화개');
  // rarity
  const tr=[];
  if(GOEGANG.includes(ilju))tr.push({l:'괴강 일주',p:5/60*100,exact:1});
  if(BAEKHO.includes(ilju))tr.push({l:'백호 일주',p:7/60*100,exact:1});
  c.counts.forEach((v,i)=>{
    if(v===0)tr.push({l:`${EL[i]} 0개`,p:freq(known,x=>x.c[i]===0)});
    if(v>=4)tr.push({l:`${EL[i]} ${v}개 이상`,p:freq(known,x=>x.c[i]>=v)});});
  if(!missing.length&&Math.max(...c.counts)<=2)tr.push({l:'오행 고루 갖춤',p:freq(known,x=>Math.min(...x.c)>=1&&Math.max(...x.c)<=2)});
  else if(!missing.length)tr.push({l:'오행 다섯 모두 있음',p:freq(known,x=>Math.min(...x.c)>=1)});
  if(gwBr.length>=2)tr.push({l:'천을귀인 2개 이상',p:freq(known,x=>x.g>=2)});
  if(!tr.length)tr.push({l:`${iljuKo} 일주`,p:100/60,exact:1});
  tr.sort((a,b)=>a.p-b.p);
  // texts
  const nm=short(p.name||'이 사람');
  const [img,trait]=STEM_IMG[ds];
  const N=c.list.length*2, dEl=STEM_EL[ds];
  const sup=c.counts[dEl]+c.counts[(dEl+4)%5];
  const t1=[`${season}(${BR[c.P.month.b]}월)에 태어난 ${j(img,'이라','라')} ${trait}`];
  if(GOEGANG.includes(ilju))t1.push(`${iljuKo}은 괴강 일주라 한번 정하면 잘 안 흔들려요`);
  else if(sup/N>=0.5)t1.push('자기 중심이 단단한 편이에요');
  else t1.push('주변과 호흡을 맞추는 힘이 좋은 편이에요');
  const big=Object.entries(cat).filter(([,v])=>v.length>=2).sort((a,b)=>b[1].length-a[1].length)[0];
  const CATLINE={'식상':'표현력과 재능이 좋아요','재성':'현실 감각이 빨라요','관성':'책임감이 강해요','인성':'배우고 생각하는 힘이 깊어요','비겁':'독립심과 자존심이 강해요'};
  if(big)t1.push(`${big[0]}(${big[1].join('·')})이 있어 ${CATLINE[big[0]]}`);
  if(p.mbti)t1.push(`${p.mbti}답게 ${MBTI_P[p.mbti]} 타입`);
  const t2=[];
  const inn=cat['인성']||[];
  if(inn.length>=2)t2.push(`인성(${inn.join('·')})이 받쳐줘서 어른·선생님 복이 있는 편이에요`);
  else if(inn.length===1)t2.push(`인성(${inn[0]})이 하나 있어 필요할 때 도와줄 윗사람은 있어요`);
  else t2.push('인성이 없어 스스로 길을 내는 편이라, 도움을 먼저 청할수록 복이 붙어요');
  const bg=cat['비겁']||[]; if(bg.length>=2)t2.push(`비겁(${bg.join('·')})이 ${bg.length}개라 또래·동료는 많지만 경쟁도 함께 와요`);
  const kw=cat['관성']||[]; if(kw.length>=2)t2.push(`관성(${kw.join('·')})이 ${kw.length}개라 스스로에게 엄격하고 부담을 혼자 지는 경향이 있어요`);
  if(gwBr.length)t2.push(`자기 사주 안에 천을귀인(${gwBr.map(b=>BR[b]).join('·')})이 있어 막힐 때 도움이 잘 붙어요`);
  else t2.push(`자기 사주 안에 천을귀인(${GWIIN[ds].map(b=>BR[b]).join('·')})이 없어서, 귀인이 바깥에서 들어오는 구조예요`);
  if(missing.length)t2.push(`${missing.map(i=>`${EL[i]}(${ELH[i]})`).join('·')}가 0개라 그 기운을 주는 사람이 귀인이 돼요`);
  return {p,known,c,ds,ilju,iljuKo,others,cat,missing,season,gwBr,inbok,parts,sal,tr,nm,t1,t2};
}

// ---------- perspective: what B is to A
function perspective(A,B){
  const g=GWIIN[A.ds], hit=[...new Set(B.c.brs.filter(b=>g.includes(b)))];
  const tg=tenGod(A.ds,B.ds);
  const title=hit.length?`${j(B.nm,'은','는')} ${A.nm}에게 천을귀인`:`${j(B.nm,'은','는')} ${A.nm}에게 ${tg} 같은 사람`;
  const body=[];
  if(hit.length){
    body.push(`${STEM_KO[A.ds]}${EL[STEM_EL[A.ds]]} 일간의 천을귀인은 ${g.map(b=>BR[b]).join('·')}인데, ${j(B.nm,'이','가')} ${hit.length===2?'이 두 글자를 모두':hit.map(b=>BR[b]).join('')+' 글자를'} 갖고 있어요.`+(A.gwBr.length?'':` ${A.nm} 사주에 비어 있던 귀인 자리를 정확히 채우는 사람.`));
    body.push(`일간끼리 보면 ${j(B.nm,'은','는')} ${j(tg,'이라','라')} ${TG_ROLE[tg][0]}`);
  } else body.push(`${B.nm}의 일간 ${STEM_KO[B.ds]+EL[STEM_EL[B.ds]]}(${STEMS[B.ds]})${hasBatchim(EL[STEM_EL[B.ds]])?'은':'는'} ${A.nm}에게 ${j(tg,'이에요','예요')}. ${TG_ROLE[tg][0]}`);
  const fill=A.missing.filter(i=>B.c.counts[i]>0);
  if(fill.length){let s=`${A.nm}에게 없는 ${fill.map(i=>`${EL[i]}(${ELH[i]})`).join('·')} 기운을 ${j(B.nm,'이','가')} 채워줘요.`;
    if(A.season==='겨울'&&fill.includes(1))s=s.replace(/채워줘요\.$/,'채워줘서 겨울 기운에 온기를 넣어주는 조후 역할까지 해요.');
    if(A.season==='여름'&&fill.includes(4))s=s.replace(/채워줘요\.$/,'채워줘서 뜨거운 여름 기운을 식혀주는 조후 역할까지 해요.');
    body.push(s);}
  // B's strongest element as gift
  const mx=Math.max(...B.c.counts), be=B.c.counts.indexOf(mx), bc=tgCatEl(A.ds,be);
  if(bc!==tgCat(tg)&&mx>=2)body.push(`또 ${B.nm}의 ${EL[be]}(${ELH[be]}) 기운은 ${A.nm}에게 ${bc}이라 ${j(CAT_GIFT[bc],'을','를')} 더해줘요.`);
  return {from:`${A.p.name} 기준`,title,body,care:TG_ROLE[tg][1],tg,hit};
}

// ---------- compatibility
function compat(A,B){
  let s=62;const good=[],warn=[],neu=[];
  const ad=A.c.P.day,bd=B.c.P.day;
  const dd=Math.abs(ad.s-bd.s);
  if(dd===5){s+=10;good.push(['일간합',`${STEMS[ad.s]}·${STEMS[bd.s]}가 합을 이뤄 처음부터 서로 끌리는 인연이에요.`])}
  // day branch
  const a=ad.b,b=bd.b,dayNotes=[];

function verdict(L){const {A,B,VA,VB,C,M,BL,total}=L;const a=A.nm,b=B.nm;
  const goods=C.items.filter(x=>x[0]==='good').map(x=>x[1]);const warn=C.items.some(x=>x[0]==='warn');
  const P=[];
  P.push(`${a}님과 ${b}님, 두 분 사주를 나란히 펼쳐 보니 ${tierLine(total)}.`);
  let s2='';
  if(goods.length)s2+=`가장 먼저 눈에 들어오는 건 ${goods.slice(0,2).join('과 ')}이에요. `;
  if(VA.hit.length)s2+=`특히 ${j(b,'은','는')} ${a}님의 천을귀인을 가진 사람이라, 막힐 때 길을 열어주는 인연이에요. `;
  else if(VB.hit.length)s2+=`특히 ${j(a,'은','는')} ${b}님의 천을귀인을 가진 사람이라, 막힐 때 길을 열어주는 인연이에요. `;
  if(warn)s2+='다만 원국끼리 부딪히는 글자도 있어서, 감정이 쌓이기 전에 그때그때 푸는 게 오래 가는 비결이에요.';
  if(s2)P.push(s2.trim());
  const s3=[];
  if(M)s3.push(`MBTI는 ${M.pair}, ${M.title}이에요`);else s3.push('MBTI는 한 분이 모른다고 하셔서 이번엔 빼고 봤어요');
  if(BL)s3.push(`혈액형은 ${BL.pair}로 ${BL.tag} 조합이고요`);else s3.push('혈액형도 모르는 분이 있어 사주 비중을 높였어요');
  P.push(s3.join('. ')+'.');

  return P;}

  </div></section>`;}

function collect(validate){const st=STEPS[SI],P=PEOPLE[st.pi];let e='';
  if(st.k==='basic'){P.name=$('w-name').value.trim();if(validate&&!P.name)e='이름을 입력해 주세요. 별명도 괜찮아요.'}
  if(st.k==='birth'){P.date=$('w-date').value;P.unk=$('w-unk').checked;P.time=P.unk?'':$('w-time').value;
    if(validate){if(!P.date)e='생년월일을 입력해 주세요.';else{const y=+P.date.slice(0,4);if(y<1920||y>2030)e='1920년부터 2030년 사이로 입력해 주세요.'}
      if(!e&&!P.unk&&!P.time)e="태어난 시각을 넣거나 '태어난 시간 모름'을 체크해 주세요.";
      if(!e&&!P.unk){const mm=P.time.match(/^(\d{1,2}):?(\d{2})$/);if(!mm||+mm[1]>23||+mm[2]>59)e='시각은 00:00부터 23:59 사이로 입력해 주세요. 예: 17:14';else P.time=pad(+mm[1])+':'+mm[2]}}}
  if(st.k==='mbti'){if(P.mbtiAx.every(x=>x))P.mbtiUnk=false;if(validate&&!P.mbtiUnk&&P.mbtiAx.some(x=>!x))e="네 줄 모두 골라 주세요. 모르면 아래 건너뛰기를 눌러 주세요.";
    P.mbti=P.mbtiUnk?'':P.mbtiAx.join('')}
  if(st.k==='blood'){if(validate&&!P.bloodSet)e="혈액형을 골라 주세요. 모르면 아래 건너뛰기를 눌러 주세요."}
  if(e){const el=$('w-err');el.textContent=e;el.hidden=false;return false}return true}

function axes(R){const n=k=>(R.cat[k]||[]).length,cnt=t=>R.others.filter(o=>o.t===t).length;
  const out=n('식상')+n('재성'),inn=n('인성')+n('관성');
  const S={e:out>inn?'외향':out<inn?'내향':(R.ds%2===0?'외향':'내향')};
  const th=n('재성')+n('관성'),fe=n('식상')+n('인성');S.t=th>fe?'이성':th<fe?'감성':'균형';
  const pl=n('관성')+cnt('정인')+cnt('정재'),fr=n('식상')+cnt('편재')+cnt('편인')+cnt('겁재');S.j=pl>fr?'계획':pl<fr?'즉흥':'균형';
  const ld=n('비겁')+cnt('편관')+cnt('상관')+cnt('편재'),cr=n('인성')+cnt('식신')+cnt('정재')+cnt('정관');S.r=ld>cr?'리드':ld<cr?'배려':'균형';
  let M=null;const m=R.p.mbti;if(m)M={e:m[0]==='E'?'외향':'내향',t:m[2]==='T'?'이성':'감성',j:m[3]==='J'?'계획':'즉흥',r:(m[0]==='E'&&(m[2]==='T'||m[3]==='J'))?'리드':'배려'};
  const BT={A:['내향','감성','계획','배려'],B:['외향','이성','즉흥','리드'],O:['외향','감성','계획','리드'],AB:['내향','이성','즉흥','배려']};
  let B=null;if(R.p.blood){const v=BT[R.p.blood];B={e:v[0],t:v[1],j:v[2],r:v[3]}}
  return {S,M,B};}
function threeView(R){const {S,M,B}=axes(R);const rows=[['e','에너지'],['t','판단'],['j','생활'],['r','관계']];
  const same=[],diff=[];
  rows.forEach(([k,lb])=>{const vals=[S[k],M&&M[k],B&&B[k]].filter(Boolean);
    if(vals.length<2)return;
    const agree=vals.every(v=>v===vals[0])&&vals[0]!=='균형';
    if(agree)same.push(`${j(lb,'은','는')} ${vals[0]}`);else{const parts=[`사주는 ${S[k]}`];if(M)parts.push(`MBTI는 ${M[k]}`);if(B)parts.push(`혈액형은 ${B[k]}`);diff.push(`${lb}: ${parts.join(', ')}`)}});
  const cell=(v,k)=>{if(!v)return '<span class="v x">모름</span>';const mj=[S[k],M&&M[k],B&&B[k]].filter(x=>x===v).length>=2&&v!=='균형';return `<span class="v ${mj?'m':''}">${v}</span>`};
  const table=`<div class="cmp"><div class="cmp-row h"><span></span><span style="text-align:center">사주</span><span style="text-align:center">MBTI</span><span style="text-align:center">혈액형</span></div>${rows.map(([k,lb])=>`<div class="cmp-row"><span class="ax">${lb}</span>${cell(S[k],k)}${cell(M&&M[k],k)}${cell(B&&B[k],k)}</div>`).join('')}</div>`;
  let sum;
  if(!M&&!B)sum='MBTI와 혈액형을 모르셔서 이번엔 사주만으로 봤어요. 알게 되면 다시 넣어 세 관점을 비교해 보세요.';
  else if(same.length>=3)sum=`세 관점이 거의 같은 얘기를 해요. ${same.join(', ')}. 겉으로 보이는 모습과 타고난 기질이 일치하는, 예측 가능하고 믿음직한 타입이에요.`;
  else if(same.length)sum=`${same.join(', ')}이라는 점은 모든 관점이 동의해요. 나머지는 관점마다 달라서, 상황에 따라 다른 얼굴이 나오는 입체적인 사람이에요.`;
  else sum='세 관점이 모두 다른 얘기를 해요. 타고난 기질과 지금의 성격이 다르게 자랐다는 뜻이라, 의외의 매력을 가진 반전형이에요.';
  return {table,sum,same,diff};}

function renderPair(A,B){const VA=perspective(A,B),VB=perspective(B,A);const strip=R=>({...R,p:{...R.p,mbti:''}});
  const C=compat(strip(A),strip(B)),M=mbtiCompat(A,B),BL=bloodCompat(A,B);
  let w=0.6,tot=C.s*0.6;if(M){w+=0.25;tot+=M.s*0.25}if(BL){w+=0.15;tot+=BL.s*0.15}const total=Math.round(tot/w);
  const L={A,B,VA,VB,C,M,BL,total};
  const sub=(k,v)=>v==null?'':`<div class="sub"><span>${k}</span><span class="t"><i style="width:${v}%"></i></span><b>${v}</b></div>`;
  const items=arr=>`<div class="items">${arr.map(([t,h,x])=>`<div class="item ${t}"><span class="st"></span><p><strong>${esc(h)}</strong> ${esc(x)}</p></div>`).join('')}</div>`;
  const tag=R=>[R.p.blood&&R.p.blood+'형',R.p.mbti].filter(Boolean).join(' · ')||'&nbsp;';
  $('shot').innerHTML=`
  <div class="shot-head"><div class="logo"><b>묘연</b><i>妙緣</i></div><span class="by">made by yena choi</span></div>
  <section class="rhero"><div class="duo" style="width:100%"><div class="pp"><div class="arch port" style="background-image:url(${rabImg(A.p.gen)})"></div><b>${esc(A.p.name)}</b><span>${tag(A)}</span></div><span class="heart">合</span><div class="pp"><div class="arch port" style="background-image:url(${rabImg(B.p.gen)})"></div><b>${esc(B.p.name)}</b><span>${tag(B)}</span></div></div>
    <div class="big"><span class="n">${total}<small>점</small></span><span class="lb">${label(total)}</span></div>
    <div class="subs">${sub('사주',C.s)}${sub('MBTI',M?M.s:null)}${sub('혈액형',BL?BL.s:null)}</div></section>
  <section class="card verdict"><span class="seal" aria-hidden="true"><span>鑑</span><span>定</span></span><span class="kick">30년 상담 노트</span><h2>총평</h2>${verdict(L).map(x=>`<p>${esc(x)}</p>`).join('')}<span class="sign">묘연 토끼 점술가</span></section>
  ${personHTML(A,'ca')}${personHTML(B,'cb')}
  ${noteHTML(VA,A,'na')}${noteHTML(VB,B,'nb')}
  <section class="card"><div class="sec-h"><div><span class="kick">四柱 宮合</span><h2>사주 궁합</h2></div><span class="n">${C.s}<small>점</small></span></div>${items(C.items)}</section>
  <section class="card"><div class="sec-h"><div><span class="kick">MBTI</span><h2>MBTI 궁합</h2></div>${M?`<span class="n">${M.s}<small>점</small></span>`:''}</div>
    ${M?`${M.gold?'<span class="gold-badge">황금 궁합</span>':''}<p><b>${M.pair}</b> · ${M.title}</p>${items(M.lines.map(([h,x])=>['neu',h,x]))}`:`<p style="color:var(--muted)">${esc([!A.p.mbti&&A.p.name,!B.p.mbti&&B.p.name].filter(Boolean).join(', '))}님의 MBTI를 몰라서 MBTI 궁합은 빼고 계산했어요.</p>`}</section>
  <section class="card"><div class="sec-h"><div><span class="kick">血液型</span><h2>혈액형 궁합</h2></div>${BL?`<span class="n">${BL.s}<small>점</small></span>`:''}</div>
    ${BL?`<p><b>${BL.pair}</b> · ${BL.tag} 조합</p><p>${esc(BL.t)}</p>`:'<p style="color:var(--muted)">혈액형을 모르는 분이 있어 혈액형 궁합은 빼고 계산했어요.</p>'}</section>
  ${tipsHTML(L)}
  <p class="foot">묘연 사주 X MBTI · made by yena choi<br>양력 기준, 서울 진태양시 보정. 점수와 혈액형 풀이는 재미로 보는 지표예요.</p>`;
  CARD={kind:'pair',L};
  lastText=`[묘연 사주 X MBTI · made by yena choi]\n\n${A.p.name} × ${B.p.name} 궁합 ${total}점 (${label(total)})\n\n${verdict(L).join(' ')}\n\n${VA.title}\n${VB.title}`;
}

// ================= flow =================
let LASTN='';
function finish(){const Rs=PEOPLE.map(p=>analyze({name:p.name,date:p.date,time:p.unk?'':p.time,gen:p.gen,blood:p.blood,mbti:p.mbtiUnk?'':p.mbti}));
  if(MODE==='pair'){renderPair(Rs[0],Rs[1]);LASTN=`${Rs[0].p.name}_${Rs[1].p.name}`}else{renderSingle(Rs[0]);LASTN=Rs[0].p.name}
  const me=PEOPLE[0];store('myoyeon.me',{name:me.name,date:me.date,time:me.unk?'':me.time,gen:me.gen,blood:me.blood,mbti:me.mbtiUnk?'':me.mbti});
  renderToday();$('toast').hidden=true;$('copyBox').hidden=true;show('result');}
function show(v){['home','wizard','result'].forEach(id=>$(id).hidden=id!==v);window.scrollTo(0,0)}
$('startSingle').onclick=()=>startWizard('single');$('recRare').onclick=()=>startWizard('single');
$('startPair').onclick=()=>startWizard('pair');$('recPair').onclick=()=>startWizard('pair');
$('recSample').onclick=()=>{MODE='single';PEOPLE=[randPerson(pick(['여','남']))];STEPS=['basic','birth','mbti','blood'].map(k=>({pi:0,k}));SI=3;
  const p=PEOPLE[0];const R=analyze({name:p.name,date:p.date,time:p.time,gen:p.gen,blood:p.blood,mbti:p.mbti});renderSingle(R);LASTN=p.name;$('toast').hidden=true;show('result')};
$('redo').onclick=()=>{SI=0;show('wizard');drawStep()};

// ================= copy & image =================
$('copy').onclick=()=>{const fb=()=>{const b=$('copyBox');b.value=lastText;b.hidden=false;b.focus();b.select();say('아래 글을 길게 눌러 복사해 주세요.')};
  try{navigator.clipboard.writeText(lastText).then(()=>say('복사했어요.'),fb)}catch(e){fb()}};
let dlP=null;const getDl=()=>dlP||(dlP=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use('downloads')).catch(()=>null):Promise.resolve(null));
let CARD=null;
const mark=`<div class="logo"><span class="mk" style="background-image:url(${IMG.icon})"></span><b>묘연</b><i>妙緣</i></div>`;
function cardHTML(){const foot=`<div class="ft"><span>묘연 사주 X MBTI</span><i>made by yena choi</i></div>`;
  if(CARD.kind==='single'){const {R,TV,mb,bd}=CARD;const p=R.p,top=R.tr[0];
    const pz=[['시',R.c.P.hour],['일',R.c.P.day],['월',R.c.P.month],['년',R.c.P.year]].map(([l,x])=>`<div class="${l==='일'?'d':''}"><small>${l}</small>${x?STEMS[x.s]+BR[x.b]:'?'}</div>`).join('');
    const first=s=>s.split(/(?<=[.요])\s/)[0];
    return `<div class="hd">${mark}<small>나의 종합 분석</small></div>
     <div class="ctr"><div class="face" style="background-image:url(${faceImg(p.gen)})"></div><div class="nm">${esc(p.name)}</div><p class="one">${esc(CARD.one)}</p></div>
     <div class="chips3"><div>일주<b>${R.iljuKo}</b></div><div>MBTI<b>${p.mbti||'모름'}</b></div><div>혈액형<b>${p.blood?p.blood+'형':'모름'}</b></div></div>
     <div class="pz">${pz}</div>
     <div class="tl"><div><small>인복</small><b>${R.inbok}점</b><span>등급 ${inbokGrade(R.inbok)}</span></div><div><small>희귀도 ${rareGrade(top.p)}</small><b>${top.exact?'':'약 '}${fmtP(top)}명</b><span>100명 중 · ${esc(top.l)}</span></div></div>
     <div class="box"><p><b>기질</b> ${esc(R.t1[0])}.</p><p><b>세 관점</b> ${esc(first(TV.sum))}</p><p><b>연애</b> ${esc(STEM_LOVE[R.ds])}.</p></div>${foot}`;}
  const {A,B,VA,VB,C,M,BL,total}=CARD.L;
  const sub=(k,v)=>v==null?'':`<div><span>${k}</span><i><em style="width:${v}%"></em></i><b>${v}</b></div>`;
  const goods=C.items.filter(x=>x[0]==='good').slice(0,3).map(x=>`<span>${esc(x[1])}</span>`).join('');
  return `<div class="hd">${mark}<small>둘이 보는 궁합</small></div>
   <div class="ctr"><div style="display:flex;align-items:center;gap:14px"><div class="face sm" style="background-image:url(${faceImg(A.p.gen)})"></div><span style="font-family:var(--hanja);font-size:24px;color:var(--rose)">合</span><div class="face sm" style="background-image:url(${faceImg(B.p.gen)})"></div></div>
   <div class="nm" style="font-size:22px">${esc(A.p.name)} × ${esc(B.p.name)}</div><div class="score">${total}<small>점</small></div><div class="lbl">${label(total)}</div></div>
   <div class="subs2">${sub('사주',C.s)}${sub('MBTI',M?M.s:null)}${sub('혈액형',BL?BL.s:null)}</div>
   <div class="box"><p><b>${esc(A.nm)} 기준</b> ${esc(VA.title)}</p><p><b>${esc(B.nm)} 기준</b> ${esc(VB.title)}</p>${M?`<p><b>MBTI</b> ${M.pair}, ${M.title}</p>`:''}${BL?`<p><b>혈액형</b> ${BL.pair}, ${BL.tag} 조합</p>`:''}</div>
   ${goods?`<div class="tagr">${goods}</div>`:''}${foot}`;}
function say(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>el.hidden=true,3500)}
function openCard(){if(!CARD)return;const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<p>핵심 결과만 담은 9:16 이미지예요.</p><div class="sc-wrap"><div class="sc" id="card">${cardHTML()}</div></div><p class="msg" style="min-height:1em"></p><div class="btns"><button type="button" class="primary" data-a="save">이미지 저장</button><button type="button" data-a="close">닫기</button></div>`;
  document.body.appendChild(ov);const msg=ov.querySelector('.msg');const sv=ov.querySelector('[data-a=save]');
  ov.querySelector('[data-a=close]').onclick=()=>ov.remove();sv.focus();
  sv.onclick=async()=>{if(sv.disabled)return;sv.disabled=true;const old=sv.textContent;sv.textContent='만드는 중…';
    try{if(!window.html2canvas)throw new Error('lib');try{await document.fonts.ready}catch(e){}
      const cv=await html2canvas($('card'),{scale:3,backgroundColor:'#FFF9F1',logging:false,width:360,height:640});
      const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const dl=await getDl();
      const showImg=()=>{const im=document.createElement('img');im.src=cv.toDataURL('image/png');im.alt='9:16 결과 이미지';im.style.width='360px';ov.querySelector('.sc-wrap').replaceChildren(im);msg.textContent='이미지를 길게 누르거나 오른쪽 클릭해서 저장해 주세요.'};
      const fn=`묘연_${LASTN}.png`;
      if(!dl&&blob){const file=new File([blob],fn,{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){try{await navigator.share({files:[file],title:'묘연 분석 결과'});msg.textContent='공유 창에서 이미지 저장을 눌러 주세요.';return}catch(e){if(e&&e.name==='AbortError'){msg.textContent='저장을 취소했어요.';return}}}
        try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);msg.textContent='이미지를 저장했어요.';return}catch(e){}}
      if(dl&&blob){try{await dl.save({filename:`묘연_${LASTN}.png`,data:blob});msg.textContent='이미지를 저장했어요.'}
        catch(e){if(e&&e.code==='declined')msg.textContent='저장을 취소했어요.';else if(e&&e.code==='rate_limited')msg.textContent='저장 창이 이미 열려 있어요. 잠시 후 다시 눌러 주세요.';else showImg()}}
      else showImg();
    }catch(e){msg.textContent='이미지를 만들지 못했어요. 이 화면을 캡처해서 저장해 주세요.'}
    finally{sv.disabled=false;sv.textContent=old}};}
$('saveImg').onclick=openCard;$('saveTop').onclick=openCard;
let lastText='';

})();
</script>
